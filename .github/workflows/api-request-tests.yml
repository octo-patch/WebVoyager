name: API request tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned runtime and request-test dependencies
        run: python -m pip install -r requirements.txt httpx==0.27.2 numpy==1.26.4
      - name: Check request serialization and syntax
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile run.py tests/test_api_requests.py
          bash -n run.sh
          git diff --check
